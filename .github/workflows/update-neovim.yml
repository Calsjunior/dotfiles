name: Update Neovim Plugins
run-name: "chore(deps): update neovim plugins"
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      COMMIT_MSG: "chore(deps): update neovim plugins"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prebuilt Neovim nightly
        run: |
          curl -LO https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$GITHUB_WORKSPACE/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Write update script
        run: |
          cat > update.lua << 'EOF'
          vim.wait(2000)
          vim.pack.update(nil, { force = true })
          vim.cmd('qa')
          EOF

      - name: Update nvim-pack-lock.json
        run: |
          XDG_CONFIG_HOME="$GITHUB_WORKSPACE/config" \
          XDG_DATA_HOME="$HOME/.local/share" \
          nvim --headless -c "lua dofile('update.lua')"

      - name: Commit and Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet config/nvim/nvim-pack-lock.json; then
            echo "Neovim plugins are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 -c '
          import json, subprocess, os

          try:
              old_json = subprocess.check_output(["git", "show", "HEAD:config/nvim/nvim-pack-lock.json"]).decode("utf-8")
              old_data = json.loads(old_json).get("plugins", {})
          except Exception:
              old_data = {}

          with open("config/nvim/nvim-pack-lock.json") as f:
              new_data = json.load(f).get("plugins", {})

          def get_rev(entry):
              return entry.get("rev")

          def get_repo_url(plugin_name):
              path = os.path.expanduser(f"~/.local/share/nvim/site/pack/core/opt/{plugin_name}")
              if not os.path.isdir(path): return ""
              try:
                  url = subprocess.check_output(["git", "-C", path, "config", "--get", "remote.origin.url"], stderr=subprocess.DEVNULL).decode("utf-8").strip()
                  if url.endswith(".git"): url = url[:-4]
                  if url.startswith("git@github.com:"): url = "https://github.com/" + url.split(":", 1)[1]
                  return url
              except Exception:
                  return ""

          plain_rows = []
          rich_rows = []
          for plugin in sorted(set(old_data) | set(new_data)):
              old_rev = get_rev(old_data.get(plugin, {}))
              new_rev = get_rev(new_data.get(plugin, {}))

              url = get_repo_url(plugin)

              def make_link(rev, fallback_text):
                  if not rev: return fallback_text
                  short = f"`{rev[:7]}`"
                  return f"[{short}]({url}/commit/{rev})" if url else short

              if plugin not in new_data:
                  plain_rows.append((plugin, f"`{old_rev[:7]}`", "*removed*"))
                  rich_rows.append((plugin, make_link(old_rev, ""), "*removed*"))
              elif plugin not in old_data:
                  plain_rows.append((plugin, "*new*", f"`{new_rev[:7]}`"))
                  rich_rows.append((plugin, "*new*", make_link(new_rev, "")))
              elif old_rev != new_rev:
                  plain_rows.append((plugin, f"`{old_rev[:7]}`", f"`{new_rev[:7]}`"))

                  rich_from = make_link(old_rev, "")
                  rich_to = make_link(new_rev, "")
                  rich_plugin = f"[{plugin}]({url}/compare/{old_rev}...{new_rev})" if url else plugin
                  rich_rows.append((rich_plugin, rich_from, rich_to))

          def write_plain_table(filename, rows):
              with open(filename, "w") as f:
                  f.write("Automated plugin updates via vim.pack.\n\n")
                  if rows:
                      w_plugin = max(len("Plugin"), *(len(p) for p, _, _ in rows))
                      w_from = max(len("From"), *(len(a) for _, a, _ in rows))
                      w_to = max(len("To"), *(len(b) for _, _, b in rows))
                      def row(a, b, c):
                          return f"| {a:<{w_plugin}} | {b:<{w_from}} | {c:<{w_to}} |\n"
                      f.write(row("Plugin", "From", "To"))
                      f.write(row("-" * w_plugin, "-" * w_from, "-" * w_to))
                      for p, a, b in rows:
                          f.write(row(p, a, b))

          def write_rendered_table(filename, rows):
              with open(filename, "w") as f:
                  f.write("Automated plugin updates via vim.pack.\n\n### Plugin Updates\n\n")
                  if rows:
                      f.write("| Plugin | From | To |\n")
                      f.write("| :--- | :--- | :--- |\n")
                      for p, a, b in rows:
                          f.write(f"| {p} | {a} | {b} |\n")

          write_plain_table("commit_body.md", plain_rows)
          write_rendered_table("pr_body.md", rich_rows)
          '

          git add config/nvim/nvim-pack-lock.json
          git commit -m "$COMMIT_MSG" -m "$(cat commit_body.md)"

          git checkout -b chore/update-nvim-pack-lock
          git push -f origin chore/update-nvim-pack-lock

          gh pr create \
            --title "$COMMIT_MSG" \
            --body-file pr_body.md \
            --label "dependencies" || \
          gh pr edit chore/update-nvim-pack-lock \
            --title "$COMMIT_MSG" \
            --body-file pr_body.md
